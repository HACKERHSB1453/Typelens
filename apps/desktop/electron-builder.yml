# Packaging for TypeLens desktop. Run through the scripts in package.json (they build first).
appId: io.github.typelens.desktop
productName: TypeLens
copyright: Copyright (c) TypeLens contributors
electronVersion: 44.7.0

directories:
  app: app            # the bundle build.mjs generates (main, preload, renderer, package.json)
  output: release
  buildResources: build

asar: true
npmRebuild: false
nodeGypRebuild: false
# everything is bundled by esbuild (electron-updater included), so nothing is installed into the package
files:
  - "**/*"
extraResources:
  # the browser extension, so users can load it straight from the install folder
  - from: ../extension/dist
    to: extension
  - from: ../extension/dist-firefox
    to: extension-firefox

protocols:
  - name: TypeLens
    schemes: [typelens]

# ---- WHERE UPDATES COME FROM: change these two values to your GitHub account/repository -------------------
# (build.mjs also reads them to build the project links shown inside the app)
publish:
  provider: github
  owner: HACKERHSB1453
  repo: Typelens
# ----------------------------------------------------------------------------------------------------------

win:
  target:
    - nsis
    - zip
  artifactName: "${productName}-${version}-win-${arch}.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: TypeLens
  deleteAppDataOnUninstall: false
  artifactName: "${productName}-Setup-${version}-${arch}.${ext}"

mac:
  # Apple Silicon and Intel builds. No Apple Developer certificate yet: "-" applies an ad-hoc signature, which
  # Apple Silicon requires to run at all ("app is damaged" without it). Gatekeeper still warns on first launch
  # (right-click > Open). Hardened runtime is off because ad-hoc signing cannot use it without extra entitlements.
  # Auto-update is disabled on macOS in updater.ts, since Squirrel.Mac only accepts properly signed apps.
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.utilities
  identity: "-"
  hardenedRuntime: false
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"
dmg:
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"

linux:
  # deb, rpm and pacman (Arch Linux, Manjaro, EndeavourOS). No AppImage: Ubuntu 23.10+ blocks its Chromium sandbox (AppArmor user namespaces) and its
  # temporary mount path breaks the typelens:// handler and the bundled extension folder. The deb/rpm keep
  # electron-builder's default SUID chrome-sandbox handling (do not add --no-sandbox).
  target:
    - deb
    - rpm
    - pacman
  executableName: typelens
  # installs /usr/share/applications/typelens.desktop (from desktopName in package.json) with StartupWMClass=typelens,
  # so running windows match their launcher entry (Electron's app_id)
  syncDesktopName: true
  category: Utility
  synopsis: Local-first typing analytics for Monkeytype
  description: >-
    TypeLens records your Monkeytype tests through a companion browser extension and shows per-key,
    n-gram, finger and word statistics, replays and custom practice text. Everything stays on your computer.
  maintainer: TypeLens contributors <noreply@typelens.invalid>
  desktop:
    entry:
      Name: TypeLens
      Comment: Local-first typing analytics for Monkeytype
      Categories: Utility;Education;
      Keywords: typing;monkeytype;wpm;analytics;
      MimeType: x-scheme-handler/typelens;
  artifactName: "${productName}-${version}-${arch}.${ext}"
deb:
  # setting depends replaces electron-builder's defaults, so they are listed here too.
  # libasound2t64 is the Ubuntu 24.04+ / Debian 13 name; libasound2 is the older name (alternatives).
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0, "libasound2t64 | libasound2", libgbm1]
rpm:
  # Electron apps ship identical helper binaries, so their /usr/lib/.build-id debug links collide and dnf refuses to
  # install next to e.g. Slack or VS Code. TypeLens does not need those links.
  fpm: ["--rpm-rpmbuild-define=_build_id_links none"]
pacman:
  # electron-builder's default list names packages Electron does not need (ffmpeg, re2, snappy...) and http-parser,
  # which Arch no longer ships, so `pacman -U` would fail. These are the libraries Electron actually links against.
  depends: [gtk3, nss, alsa-lib, libxss, libxtst, libnotify, xdg-utils, at-spi2-core, util-linux-libs, libsecret, mesa]
  artifactName: "${productName}-${version}-${arch}.${ext}"
