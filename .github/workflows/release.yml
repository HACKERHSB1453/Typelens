name: Release

# Builds the desktop packages and the browser extensions and creates a DRAFT GitHub Release with all artifacts.
# A maintainer checks the draft and publishes it by hand (see docs/RELEASING.md). It starts when:
#   - a commit on main changes apps/desktop/package.json (or this workflow) and the version has no vX.Y.Z tag yet:
#     merging the version bump is the release (publishing the draft creates the tag on that commit);
#   - a vX.Y.Z tag is pushed (the tag must match the version);
#   - it is run by hand (workflow_dispatch): artifacts only, no release, so a build can be tested first.

on:
  push:
    branches: [main]
    # GitHub ignores path filters for tag pushes, so tags always run
    paths: [apps/desktop/package.json, .github/workflows/release.yml]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Read version and check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      # false: a push to main that did not bump to a new version, nothing to do
      build: ${{ steps.read.outputs.build }}
      # true: create the draft release
      publish: ${{ steps.read.outputs.publish }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Read the desktop version and decide what to do
        id: read
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Desktop version: ${version}"
          build=true
          publish=false
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match apps/desktop/package.json version ${version}. Bump the version first."
              exit 1
            fi
            publish=true
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            if [ -n "$(git ls-remote --tags origin "refs/tags/v${version}")" ]; then
              echo "v${version} is already released: nothing to do."
              build=false
            else
              echo "New version ${version} on main: building the draft release."
              publish=true
            fi
          fi
          echo "build=${build}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows packages
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the Windows installer and zip
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional code signing. Add the secrets, then uncomment these two lines (see docs/RELEASING.md):
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Collect release files
        run: |
          mkdir -p release-artifacts
          find apps/desktop/release -maxdepth 1 -type f \( -name '*.exe' -o -name '*.zip' -o -name 'latest*.yml' -o -name '*.blockmap' \) -exec cp {} release-artifacts/ \;
          ls -la release-artifacts

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: release-artifacts/*
          if-no-files-found: error

  build-linux:
    name: Build Linux packages and extension zip
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install rpm and pacman tooling
        run: |
          sudo apt-get update
          # rpm builds the .rpm; bsdtar (libarchive-tools) writes the .MTREE of the Arch .pacman package
          sudo apt-get install -y rpm libarchive-tools

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the .deb, .rpm and .pacman
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Zip the browser extension (Chromium and Firefox)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        # dist:linux already built both into apps/extension/dist and dist-firefox
        run: |
          mkdir -p release-artifacts
          (cd apps/extension/dist && zip -qr "$GITHUB_WORKSPACE/release-artifacts/TypeLens-extension-${VERSION}.zip" .)
          (cd apps/extension/dist-firefox && zip -qr "$GITHUB_WORKSPACE/release-artifacts/TypeLens-extension-firefox-${VERSION}.zip" .)

      - name: Sign the Firefox extension (optional)
        # Release Firefox only installs signed add-ons. With the AMO_JWT_ISSUER and AMO_JWT_SECRET secrets set
        # (addons.mozilla.org > Developer Hub > Manage API Keys), Mozilla signs an unlisted .xpi for the release.
        # Without them this step is skipped and the unsigned zip is still published (see README).
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "AMO secrets not set: skipping Firefox signing"
            exit 0
          fi
          npx --yes web-ext@8 sign --source-dir apps/extension/dist-firefox --artifacts-dir web-ext-artifacts \
            --channel unlisted --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          cp web-ext-artifacts/*.xpi "release-artifacts/TypeLens-extension-firefox-${VERSION}.xpi"

      - name: Collect release files
        run: |
          mkdir -p release-artifacts
          find apps/desktop/release -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.pacman' -o -name 'latest*.yml' -o -name '*.blockmap' \) -exec cp {} release-artifacts/ \;
          ls -la release-artifacts

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          path: release-artifacts/*
          if-no-files-found: error

  build-macos:
    name: Build macOS disk images
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the .dmg files (Apple Silicon and Intel)
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # no Apple certificate: do not let electron-builder look for one in the runner's keychain
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Collect release files
        run: |
          mkdir -p release-artifacts
          find apps/desktop/release -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.dmg.blockmap' \) -exec cp {} release-artifacts/ \;
          ls -la release-artifacts

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-artifacts
          path: release-artifacts/*
          if-no-files-found: error

  publish:
    name: Create draft GitHub Release
    needs: [version, build-windows, build-linux, build-macos]
    # Tag pushes and version bumps on main publish; a manual run just produces the artifacts.
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-artifacts'
          path: dist-artifacts
          merge-multiple: true

      - name: List files to publish and check none is missing
        # fail_on_unmatched_files is off below because the signed .xpi is optional, so check the required ones here
        run: |
          ls -la dist-artifacts
          for pattern in '*.exe' '*-win-*.zip' '*.deb' '*.rpm' '*.pacman' '*.dmg' 'latest*.yml' 'TypeLens-extension-[0-9]*.zip' 'TypeLens-extension-firefox-*.zip'; do
            compgen -G "dist-artifacts/${pattern}" > /dev/null || { echo "::error::no file matches ${pattern}"; exit 1; }
          done

      - name: Create or update the draft release
        # Pinned to a release tag; update deliberately.
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          # for a version bump on main the tag does not exist yet: publishing the draft creates it on this commit
          target_commitish: ${{ github.sha }}
          name: TypeLens ${{ needs.version.outputs.version }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          # the .xpi exists only when the optional signing step ran
          fail_on_unmatched_files: false
          files: |
            dist-artifacts/*.exe
            dist-artifacts/*.zip
            dist-artifacts/*.deb
            dist-artifacts/*.rpm
            dist-artifacts/*.pacman
            dist-artifacts/*.xpi
            dist-artifacts/*.dmg
            dist-artifacts/latest*.yml
            dist-artifacts/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
