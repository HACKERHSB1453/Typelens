name: Feature request
description: Suggest an improvement or a new analysis
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem first, then the solution you have in mind. TypeLens focuses on analysing your own
        typing locally, so features that need an account or an internet service are unlikely to be accepted.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: For example "I cannot see which finger is slowest on the right hand" or "I want to compare two weeks".
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would it look like? A screen, a setting, an export format, a metric?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Recording (extension)
        - Desktop app
        - Analysis / statistics
        - Replay
        - Progress
        - Practice text
        - Import / export
        - Dashboard UI
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This feature keeps all data on the user's computer (no network calls for user data).
          required: true
